services:
  - type: web
    name: amertak-downloader-bot
    env: node
    region: singapore          # closest to Southeast Asia
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: BOT_TOKEN
        sync: false            # set in Render dashboard
      - key: BASE_URL
        sync: false
      - key: API_KEY
        sync: false
      - key: WEB_URL
        sync: false
      - key: PORT
        value: 3000
    disk:
      name: bot-data
      mountPath: /opt/render/project/src/db
      sizeGB: 1                # persist history.json across deploys
